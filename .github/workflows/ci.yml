name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: date_planner
          POSTGRES_USER: date_planner
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U date_planner -d date_planner"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_DB: date_planner
      POSTGRES_USER: date_planner
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      DJANGO_SECRET_KEY: ci-only-not-a-production-secret
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run Ruff
        run: ruff check .
      - name: Check Ruff formatting
        run: ruff format --check .
      - name: Run Django system checks
        run: python manage.py check
      - name: Run Django deployment checks
        env:
          DJANGO_SECRET_KEY: deploy-check-only-secret-key-with-more-than-fifty-random-looking-characters
          DJANGO_DEBUG: "False"
          DJANGO_ALLOWED_HOSTS: api.example.com
          CORS_ALLOWED_ORIGINS: https://example.com
          CSRF_TRUSTED_ORIGINS: https://example.com
          DJANGO_TRUST_PROXY_HEADERS: "True"
          DJANGO_SECURE_SSL_REDIRECT: "True"
          DJANGO_SESSION_COOKIE_SECURE: "True"
          DJANGO_CSRF_COOKIE_SECURE: "True"
          DJANGO_SECURE_HSTS_SECONDS: "3600"
          DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS: "True"
          DJANGO_SECURE_HSTS_PRELOAD: "True"
          DRF_NUM_PROXIES: "1"
        run: python manage.py check --deploy --fail-level WARNING
      - name: Check migration drift
        run: python manage.py makemigrations --check --dry-run
      - name: Run migrations
        run: python manage.py migrate --noinput
      - name: Validate OpenAPI schema
        run: python manage.py spectacular --file /tmp/date-planner-schema.yaml --validate
      - name: Run backend tests with coverage
        run: >-
          pytest
          --cov=apps.common
          --cov-config=pyproject.toml
          --cov-report=term-missing:skip-covered
          --cov-report=xml:coverage.xml
          --cov-report=html:htmlcov
      - name: Upload backend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: |
            backend/coverage.xml
            backend/htmlcov
          if-no-files-found: ignore

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint
      - name: Reject critical production dependency advisories
        run: npm audit --omit=dev --audit-level=critical
      - name: Check TypeScript
        run: npm run typecheck
      - name: Build frontend
        env:
          NUXT_PUBLIC_API_BASE_URL: http://localhost:8000
        run: npm run build
      - name: Run frontend tests with coverage
        run: npm run test:coverage
      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: ignore

  production-runtime:
    name: Production runtime checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate production Compose model
        run: >-
          docker compose
          --env-file .env.production.example
          -f docker-compose.production.yml
          config --quiet
      - name: Validate Caddyfile
        run: >-
          docker compose
          --env-file .env.production.example
          -f docker-compose.production.yml
          run --rm --no-deps proxy
          caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Build production application images
        run: >-
          docker compose
          --env-file .env.production.example
          -f docker-compose.production.yml
          --profile operations
          build backend frontend smoke
      - name: Validate production entrypoint scripts
        run: >-
          sh -n
          backend/scripts/release-production.sh
          backend/scripts/start-production.sh
          deploy/postgres/init-app-role.sh
          deploy/scripts/backup-postgres.sh
          deploy/scripts/verify-postgres-restore.sh
      - name: Reject unsafe production environment values
        env:
          DJANGO_SECRET_KEY: production-ci-secret-with-more-than-fifty-unique-looking-characters
          POSTGRES_PASSWORD: production-ci-runtime-password-29-characters
          POSTGRES_ADMIN_PASSWORD: production-ci-admin-password-31-characters
          POSTGRES_APP_PASSWORD: production-ci-app-password-33-characters
          POSTGRES_DB: date_planner
          POSTGRES_ADMIN_USER: date_planner_admin
          POSTGRES_APP_USER: date_planner_app
          APP_DOMAIN: dates.company.dev
          API_DOMAIN: api.dates.company.dev
          ACME_EMAIL: operations@company.dev
          DJANGO_SECURE_HSTS_SECONDS: "3600"
          DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS: "False"
          DJANGO_SECURE_HSTS_PRELOAD: "False"
          CADDY_HSTS: max-age=3600
        run: >-
          docker compose
          --env-file .env.production.example
          -f docker-compose.production.yml
          run --rm --no-deps
          -e DJANGO_SECRET_KEY
          -e POSTGRES_PASSWORD
          -e POSTGRES_ADMIN_PASSWORD
          -e POSTGRES_APP_PASSWORD
          -e POSTGRES_DB
          -e POSTGRES_ADMIN_USER
          -e POSTGRES_APP_USER
          -e APP_DOMAIN
          -e API_DOMAIN
          -e ACME_EMAIL
          -e DJANGO_SECURE_HSTS_SECONDS
          -e DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS
          -e DJANGO_SECURE_HSTS_PRELOAD
          -e CADDY_HSTS
          preflight
